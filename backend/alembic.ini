# Used only by the `alembic` command line, run from backend/. The app itself
# configures Alembic in code (app/db/migrate.py) and needs no ini file, and
# the database URL always comes from DATABASE_URL — never from this file.
[alembic]
script_location = app/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
