# Keeps dependencies current without anyone having to notice a deprecation
# first. Updates are grouped per ecosystem so a routine week is one PR each,
# not one per package; CI verifies every PR before it can be merged.
version: 2
updates:
  # Majors are kept here on purpose: an action's major bump is how a deprecated
  # runner (like Node 20) announces itself, and they land as one grouped PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # Library majors are a deliberate migration, not a routine update: vitest 5,
  # eslint 10 and typescript 7 each broke the build the day they were offered.
  # Security updates are still delivered regardless of this filter.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

# Base images are deliberately not tracked: Dependabot would move python:3.12
# and node:22 to newer releases that the CI matrix does not test. Bump them by
# hand, together with ci.yml.
